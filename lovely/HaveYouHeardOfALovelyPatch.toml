[manifest]
version = "1.0.0"
priority = 0


# Grading shit

    # add to the end
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''
                elseif config.name == 'discards' then
                    table.insert(left_text, {n=G.UIT.T, config={text = config.disp or config.dollars, scale = 0.8*scale, colour = G.C.RED, shadow = true, juice = true}})
                    table.insert(left_text, {n=G.UIT.O, config={object = DynaText({string = {" "..localize{type = 'variable', key = 'remaining_discard_money', vars = {G.GAME.modifiers.money_per_discard or 0}}}, colours = {G.C.UI.TEXT_LIGHT}, shadow = true, pop_in = 0, scale = 0.4*scale, silent = true})}})
'''
position = "after"
payload = '''
elseif config.name == 'grade' then
    table.insert(left_text, {n=G.UIT.T, config={text = config.disp or "", scale = 0.8*scale, colour = G.C.GREEN, shadow = true, juice = true}})
    table.insert(left_text, {n=G.UIT.O, config={object = DynaText({string = {" Grade Achieved"}, colours = {G.C.UI.TEXT_LIGHT}, shadow = true, pop_in = 0, scale = 0.4*scale, silent = true})}})
'''
match_indent = true                

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''
    if G.GAME.current_round.hands_left > 0 and not G.GAME.modifiers.no_extra_hand_money then
        add_round_eval_row({dollars = G.GAME.current_round.hands_left*(G.GAME.modifiers.money_per_hand or 1), disp = G.GAME.current_round.hands_left, bonus = true, name='hands', pitch = pitch})
        pitch = pitch + 0.06
        dollars = dollars + G.GAME.current_round.hands_left*(G.GAME.modifiers.money_per_hand or 1)
    end
'''
position = "after"
payload = '''
    if G.GAME.LastGrade then
        add_round_eval_row({  disp = G.GAME.LastGrade.grade, bonus = true, name='grade', pitch = pitch})
        pitch = pitch + 0.06
    end
'''
match_indent = true                

